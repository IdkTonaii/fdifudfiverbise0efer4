        uses: actions/checkout@v6

      - name: Check PHP
        run: |
          echo "===== PHP VERSION ====="
          php --version

          echo "===== CURL ====="
          php -r 'var_dump(function_exists("curl_init"));'

      - name: Test VPS connection
        run: |
          echo "===== TESTING VPS ====="

          curl \
            --connect-timeout 10 \
            --max-time 20 \
            -v \
            http://34.63.222.47/connectWorker67.php \
            || true

      - name: Start worker
        run: |
          echo "===== STARTING WORKER ====="

          php \
            -d display_errors=1 \
            -d display_startup_errors=1 \
            -d error_reporting=E_ALL \
            worker.php
